name: CI and release

on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9].*.*'
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validated dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Lint
        run: ruff check modules tests

      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-fail-under=60

      - name: Audit dependencies
        run: pip-audit -r requirements.txt --disable-pip

      - name: Validate deployment files
        run: |
          docker compose -f compose.yml config --quiet
          docker compose -f compose-testing.yml config --quiet
          python -c "from pathlib import Path; import yaml; [list(yaml.safe_load_all(path.read_text())) for path in Path('k8s-manifest').glob('*.yaml')]"

      - name: Build container
        env:
          BUILD_REVISION: ${{ forge.sha }}
        run: docker build --pull=false --build-arg BUILD_VERSION="$(cat VERSION)" --build-arg BUILD_REVISION="$BUILD_REVISION" --tag komga-meta-manager:ci .

  release:
    needs: quality
    if: startsWith(forge.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ forge.ref_name }}
        run: |
          APP_VERSION="$(tr -d '\r\n' < VERSION)"

          if [ "${RELEASE_TAG}" != "${APP_VERSION}" ]; then
            echo "Release tag ${RELEASE_TAG} does not match VERSION (${APP_VERSION})" >&2
            exit 1
          fi

      - name: Verify release changelog
        env:
          RELEASE_TAG: ${{ forge.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          version = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"\d{4}\.(?:[1-9]|[1-4]\d|5[0-3])\.[1-9]\d*", version):
              raise SystemExit("Release tags must use YYYY.W.N; use scripts/release.sh.")
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.search(rf"^## \[{re.escape(version)}\] — \d{{4}}-\d{{2}}-\d{{2}}$", text, re.M)
          if heading is None:
              raise SystemExit(f"CHANGELOG.md has no dated section for {version}; use scripts/release.sh.")
          notes = re.split(r"^## \[", text[heading.end():], maxsplit=1, flags=re.M)[0]
          if not re.search(r"^- \S", notes, re.M):
              raise SystemExit(f"CHANGELOG.md has no release notes for {version}.")
          PY

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: simonverbois/komga-meta-manager
          tags: |
            type=raw,value=${{ forge.ref_name }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ forge.ref_name }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ forge.sha }}
            org.opencontainers.image.source=https://github.com/simon-verbois/komga-meta-manager
            org.opencontainers.image.url=https://github.com/simon-verbois/komga-meta-manager
            
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ vars.DOCKERHUB_TOKEN }}

      - name: Push code to GitHub mirror
        env:
          GITHUB_TOKEN: ${{ vars.GITHUBPAT_TOKEN }}
        run: |
          git config --global user.name "Forgejo CI"
          git config --global user.email "ci@forgejo.local"
          git remote add github \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/simon-verbois/komga-meta-manager.git"
          git push --force github HEAD:main --tags

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            BUILD_VERSION=${{ forge.ref_name }}
            BUILD_REVISION=${{ forge.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
