name: CI and release

on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9].*.*'
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validated dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Lint
        run: ruff check modules tests

      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-fail-under=60

      - name: Audit dependencies
        run: pip-audit -r requirements.txt --disable-pip

      - name: Validate deployment files
        run: |
          docker compose -f compose.yml config --quiet
          docker compose -f compose-testing.yml config --quiet
          python -c "from pathlib import Path; import yaml; [list(yaml.safe_load_all(path.read_text())) for path in Path('k8s-manifest').glob('*.yaml')]"

      - name: Build container
        run: docker build --pull=false --tag komga-meta-manager:ci .

  release:
    needs: quality
    if: startsWith(forge.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ forge.ref_name }}
        run: |
          APP_VERSION="$(tr -d '\r\n' < VERSION)"

          if [ "${RELEASE_TAG}" != "${APP_VERSION}" ]; then
            echo "Release tag ${RELEASE_TAG} does not match VERSION (${APP_VERSION})" >&2
            exit 1
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: simonverbois/komga-meta-manager
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ forge.ref_name }}
            org.opencontainers.image.revision=${{ forge.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ vars.DOCKERHUB_TOKEN }}

      - name: Push code to GitHub mirror
        env:
          GITHUB_TOKEN: ${{ vars.GITHUBPAT_TOKEN }}
        run: |
          git config --global user.name "Forgejo CI"
          git config --global user.email "ci@forgejo.local"
          git remote add github \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/simon-verbois/Komga-Meta-Manager.git"
          git push --force github HEAD:main --tags

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}