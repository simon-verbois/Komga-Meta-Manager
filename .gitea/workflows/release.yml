name: Build and push Docker image

on:
  push:
    tags:
      - 'v*.*.*' 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validated dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ gitea.ref_name }}
        run: test "${RELEASE_TAG#v}" = "$(tr -d '\n' < VERSION)"

      - name: Run quality gates
        run: |
          ruff check modules tests
          pytest --cov --cov-report=term-missing --cov-fail-under=60
          pip-audit -r requirements.txt --disable-pip
          docker compose -f compose.yml config --quiet
          docker compose -f compose-testing.yml config --quiet

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: simonverbois/komga-meta-manager
          tags: |
            type=semver,pattern=v{{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ gitea.ref_name }}
            org.opencontainers.image.revision=${{ gitea.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push code to GitHub mirror
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUBPAT_TOKEN }}
        run: |
          git config --global user.name "Gitea CI"
          git config --global user.email "ci@gitea.local"
          git remote add github "https://x-access-token:${GITHUB_TOKEN}@github.com/simon-verbois/Komga-Meta-Manager.git"
          git push --force github HEAD:main --tags

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .  
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
