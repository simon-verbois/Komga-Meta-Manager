name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validated dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Lint
        run: ruff check modules tests

      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-fail-under=60

      - name: Audit dependencies
        run: pip-audit -r requirements.txt --disable-pip

      - name: Validate deployment files
        run: |
          docker compose -f compose.yml config --quiet
          docker compose -f compose-testing.yml config --quiet
          python -c "from pathlib import Path; import yaml; [list(yaml.safe_load_all(path.read_text())) for path in Path('k8s-manifest').glob('*.yaml')]"

      - name: Build container
        run: docker build --pull=false --tag komga-meta-manager:ci .
