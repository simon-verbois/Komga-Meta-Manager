{% extends "base.html" %}
{% block title %}{{ t('login.title') }} — Komga Meta Manager{% endblock %}

{% block content %}
<div class="w-full max-w-sm">
  <div class="text-center mb-8">
    <h1 class="text-2xl font-bold text-indigo-400">Komga Meta Manager</h1>
  </div>

  <div class="bg-gray-900 border border-gray-800 rounded-xl shadow-xl px-8 py-8">
    <h2 class="text-lg font-semibold mb-6">{{ t('login.title') }}</h2>

    {% if error %}
    <div class="mb-4 px-4 py-3 rounded-lg bg-red-900/50 border border-red-700 text-red-300 text-sm">
      {{ t(error) }}
    </div>
    {% endif %}

    <form method="post" action="/login" class="space-y-5">
      <div>
        <label class="block text-sm text-gray-300 mb-1">{{ t('login.username') }}</label>
        <input type="text" name="username" required autofocus
               class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm
                      focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>
      <div>
        <label class="block text-sm text-gray-300 mb-1">{{ t('login.password') }}</label>
        <input type="password" name="password" required
               class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm
                      focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>
      <button type="submit"
              class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5
                     rounded-lg text-sm transition-colors">
        {{ t('login.submit') }}
      </button>
    </form>
  </div>
</div>
{% endblock %}
