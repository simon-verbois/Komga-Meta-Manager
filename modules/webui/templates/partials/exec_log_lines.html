{% if lines %}
  {% for entry in lines %}
    <div class="log-line log-{{ entry.level | lower }}">
      <time class="log-time" datetime="{{ entry.ts | replace(' ', 'T') }}Z">{{ entry.ts }} UTC</time>
      <span class="log-level">{{ entry.level }}</span>
      <span class="log-message">{{ entry.msg }}</span>
    </div>
  {% endfor %}
{% else %}
  <div class="log-empty">
    {{ t("logs.exec.no_matches") if has_logs else t("logs.exec.empty") }}
    <p>{{ t("logs.exec.no_matches_help") if has_logs else t("ui.logs.exec.empty") }}</p>
  </div>
{% endif %}
