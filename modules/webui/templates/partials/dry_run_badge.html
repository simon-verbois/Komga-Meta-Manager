{% if cfg %}
  {% if cfg.system.dry_run %}
  <span class="inline-flex items-center gap-1.5 text-yellow-400 font-semibold text-sm">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
    </svg>
    {{ t('dashboard.dry_run.on') }}
  </span>
  {% else %}
  <span class="inline-flex items-center gap-1.5 text-red-400 font-semibold text-sm">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    {{ t('dashboard.dry_run.off') }}
  </span>
  {% endif %}
{% else %}
  <span class="text-gray-500 text-sm">{{ t('dashboard.no_config') }}</span>
{% endif %}
