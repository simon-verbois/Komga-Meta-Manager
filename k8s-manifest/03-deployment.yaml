---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: komga-meta-manager
  namespace: komga-meta-manager
  labels:
    app: komga-meta-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: komga-meta-manager
  template:
    metadata:
      labels:
        app: komga-meta-manager
    spec:
      containers:
      - name: komga-meta-manager
        image: simonverbois/komga-meta-manager:1.0.0
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "modules.main"]
        env:
        - name: TZ
          value: "Europe/Brussels"
        - name: KMM_KOMGA_API_KEY
          valueFrom:
            secretKeyRef:
              name: komga-meta-manager-secrets
              key: komga-api-key
              optional: true
        - name: KMM_DEEPL_API_KEY
          valueFrom:
            secretKeyRef:
              name: komga-meta-manager-secrets
              key: deepl-api-key
              optional: true
        resources:
          limits:
            cpu: "4"
            memory: "2G"
          requests:
            cpu: "1"
            memory: "512M"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 12
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
        ports:
        - name: http
          containerPort: 8765
          protocol: TCP
        volumeMounts:
        - name: config-volume
          mountPath: /config
        - name: runtime-volume
          mountPath: /tmp

      volumes:
      - name: config-volume
        persistentVolumeClaim:
          claimName: komga-meta-manager-config
      - name: runtime-volume
        emptyDir: {}

      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
