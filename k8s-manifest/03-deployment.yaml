---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: komga-meta-manager
  namespace: komga-meta-manager
  labels:
    app: komga-meta-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: komga-meta-manager
  template:
    metadata:
      labels:
        app: komga-meta-manager
    spec:
      containers:
      - name: komga-meta-manager
        image: simonverbois/komga-meta-manager:1.0.0
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "modules.main"]
        env:
        - name: TZ
          value: "Europe/Brussels"
        - name: KMM_KOMGA_API_KEY
          valueFrom:
            secretKeyRef:
              name: komga-meta-manager-secrets
              key: komga-api-key
        - name: KMM_DEEPL_API_KEY
          valueFrom:
            secretKeyRef:
              name: komga-meta-manager-secrets
              key: deepl-api-key
              optional: true
        resources:
          limits:
            cpu: "4"
            memory: "2G"
          requests:
            cpu: "1"
            memory: "512M"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        startupProbe:
          exec:
            command:
            - python
            - -c
            - "from pathlib import Path; raise SystemExit(0 if Path('/tmp/kmm-ready').exists() else 1)"
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 12
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - "from pathlib import Path; raise SystemExit(0 if Path('/tmp/kmm-ready').exists() else 1)"
          periodSeconds: 10
          timeoutSeconds: 2
        volumeMounts:
        - name: config-volume
          mountPath: /config/config.yml
          subPath: config.yml
          readOnly: true
        - name: config-volume
          mountPath: /config/translations.yml
          subPath: translations.yml
          readOnly: true
        - name: cache-volume
          mountPath: /config/cache
        - name: runtime-volume
          mountPath: /tmp

      volumes:
      - name: config-volume
        configMap:
          name: komga-meta-manager-config
          defaultMode: 0440
      - name: cache-volume
        persistentVolumeClaim:
          claimName: komga-meta-manager-cache
      - name: runtime-volume
        emptyDir: {}

      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
